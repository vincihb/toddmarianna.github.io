  <div class="dropdown">

  <script>

  function myFunction() {
    document.getElementById("dropdownBurgerMenu").classList.toggle("change");
    document.getElementById("myDropdown").classList.toggle("show");
  }

  // Close the dropdown if the user clicks outside of it
window.onclick = function(event) {
  if (!event.target.matches('.dropbtn')) {
    var dropdowns = document.getElementsByClassName("dropdown-content");
    var i;
    for (i = 0; i < dropdowns.length; i++) {
      var openDropdown = dropdowns[i];
      if (openDropdown.classList.contains('show')) {
        document.getElementById("dropdownBurgerMenu").classList.toggle("change");
        openDropdown.classList.remove('show');
      }
    }
    
  }
}

window.addEventListener("load", (event) => {
  console.log("All content loaded");
  for (left_image_index in left_images_lazy) {
    const image = document.createElement("img");
    image.setAttribute("class", "photo_gallery_images");
    image.setAttribute("loading", "lazy");
    image.setAttribute("src", left_images_lazy[left_image_index]);
    document.getElementById("left-split").append(image);
  }

  for (right_image_index in right_images_lazy) {
    const image = document.createElement("img");

    image.setAttribute("loading", "lazy");

  }
  
});
